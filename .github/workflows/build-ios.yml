name: Build Theft4 touch IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/build-ios.yml"]

permissions:
  contents: read

concurrency:
  group: theft4-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      THEFT4_RENDERER: metal
      THEFT4_BUILD_JOBS: '3'
      THEFT4_SUSTAINED_EXECUTION: 'OFF'
    steps:
      - name: Checkout exact Theft4 source
        uses: actions/checkout@v4
        with:
          repository: KoreanSeats1/Theft4
          ref: 88115fefad59cfcb62d17c0c9548a7a900c01a23
          path: Theft4
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools and verify Xcode
        run: |
          set -euo pipefail
          mkdir -p logs
          python -m pip install 'cmake>=3.29,<5' ninja
          brew install pkg-config
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcodebuild -downloadComponent MetalToolchain
          xcodebuild -showComponent MetalToolchain -json
          printf 'DEVELOPER_DIR=%s\n' "$(xcode-select -p)" >> "$GITHUB_ENV"
          printf 'THEFT4_MOLTENVK_IOS_LIB_DIR=%s/Theft4/out/moltenvk-ios\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'THEFT4_METAL_LIBRARIES=%s/Theft4/out/direct-metal/ios\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'THEFT4_METAL_HOST_LIBRARIES=%s/Theft4/out/direct-metal/ios/Host\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Apply touch changes and run portable tests
        working-directory: Theft4
        run: |
          set -euo pipefail
          patch_file="$(mktemp)"
          trap 'rm -f "$patch_file"' EXIT
          cat > "$patch_file" <<'THEFT4_TOUCH_PATCH_END'
