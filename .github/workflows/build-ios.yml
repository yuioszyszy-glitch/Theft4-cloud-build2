          c++ -std=c++17 -pthread -Iios/bridge ios/tests/touch_input_test.cpp ios/bridge/theft4_touch_input.cpp -o /tmp/touch-input-test
          /tmp/touch-input-test
          git diff --check
      - name: Install Khronos MoltenVK iOS static archive
        run: |
          set -euo pipefail
          mkdir -p "$THEFT4_MOLTENVK_IOS_LIB_DIR"
          temp_dir=$(mktemp -d)
          trap 'rm -rf "$temp_dir"' EXIT
          curl --fail --location --retry 3 -o "$temp_dir/MoltenVK-ios.tar" https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-ios.tar
          tar -xf "$temp_dir/MoltenVK-ios.tar" -C "$temp_dir"
          archive=$(find "$temp_dir" -type f -path '*/static/MoltenVK.xcframework/ios-arm64/*' \( -name libMoltenVK.a -o -name MoltenVK \) -print -quit)
          test -n "$archive"
          lipo -verify_arch arm64 "$archive"
          cp "$archive" "$THEFT4_MOLTENVK_IOS_LIB_DIR/libMoltenVK.a"
      - name: Prepare pinned Theft4 dependencies
        working-directory: Theft4
        run: |
          set -euo pipefail
          python tools/setup_repo.py 2>&1 | tee ../logs/dependencies.log
          python tools/setup_repo.py --check
      - name: Generate and compile iOS Metal shaders
        working-directory: Theft4
        run: |
          set -euo pipefail
          cmake -S tools/direct-metal -B out/direct-metal/build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee ../logs/shader-configure.log
          cmake --build out/direct-metal/build --target metal_shader_export metal_host_shader_export --parallel 3 2>&1 | tee ../logs/shader-tools.log
          out/direct-metal/build/metal_shader_export out/direct-metal/corpus
          out/direct-metal/build/metal_host_shader_export out/direct-metal/host-corpus
          python tools/direct-metal/compile_shaders.py out/direct-metal/corpus out/direct-metal/ios --platform ios --jobs 3 2>&1 | tee ../logs/game-shaders.log
          python tools/direct-metal/compile_shaders.py out/direct-metal/host-corpus out/direct-metal/ios/Host --platform ios --jobs 3 2>&1 | tee ../logs/host-shaders.log
      - name: Build and validate unsigned IPA
        working-directory: Theft4
        run: |
          set -euo pipefail
          # The Khronos distribution combines the graphics libraries into one archive.
          perl -0pi -e 's/\nrequired_libraries=\(.*?\n\)/\nrequired_libraries=(libMoltenVK.a)/s or die "Expected MoltenVK preflight not found"' tools/build_ios_release.sh
          perl -ni -e 'print unless m@\$\{THEFT4_XENIOS_IOS_LIB_DIR\}/lib(?:MoltenVK_ShaderConverter|MoltenVK_Common|spirv-cross|SPIRV-Tools)\.a"@' ios/CMakeLists.txt
          zsh tools/build_ios_release.sh 0.3.2 2>&1 | tee ../logs/ipa-build.log
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Theft4-touch-unsigned-IPA
          path: |
            Theft4/dist/*.ipa
            Theft4/dist/*.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Theft4-build-diagnostics
          path: |
            logs/
            Theft4/out/build/ios-device-release/CMakeFiles/CMakeConfigureLog.yaml
            Theft4/out/direct-metal/ios/COMPILATION.json
            Theft4/out/direct-metal/ios/Host/COMPILATION.json
          if-no-files-found: warn
          retention-days: 7
