          +#pragma once
          +#include <math.h>
          +#include <stdint.h>
          +
          +// Shared with the portable regression test; UIKit coordinates are points.
          +static inline double theft4_look_sensitivity(double value) {
          +    if (!isfinite(value)) return 1.0;
          +    return fmax(0.25, fmin(4.0, value));
          +}
          +static inline int16_t theft4_swipe_axis(double delta, double elapsed, double sensitivity) {
          +    if (!isfinite(delta) || !isfinite(elapsed) || elapsed <= 0 || elapsed > 0.25) return 0;
          +    double value = delta * theft4_look_sensitivity(sensitivity) /
          +        (18.0 * fmax(1.0 / 240.0, elapsed) * 60.0);
          +    return (int16_t)lround(fmax(-1.0, fmin(1.0, value)) * 32767.0);
          +}
          +
          +typedef struct { double x, y, w, h; } Theft4TouchRect;
          +// Landscape safe-area layout. Right middle stays open for swipe-to-look.
          +static inline Theft4TouchRect theft4_control_rect(int index, double width, double height) {
          +    double b = fmax(40, fmin(62, fmin(width / 15, height / 7.5)));
          +    double gap = 8, edge = 12, step = b + gap;
          +    double d = b * 2.4, small = fmax(36, b * 0.8), ds = small + 4;
          +    double right = width - edge - b, bottom = height - edge - b;
          +    Theft4TouchRect r = {0, 0, b, b};
          +    switch (index) {
          +        case 0: r = (Theft4TouchRect){edge, height-edge-d, d, d}; break;
          +        case 1: r.x = width/2-step; r.y = edge; break;
          +        case 2: r.x = width/2+gap; r.y = edge; break;
          +        case 3: r.x = right-step; r.y = edge; break;
          +        case 4: r.x = right; r.y = edge; break;
          +        // The two larger bottom-right pedals are LT (brake/aim), RT (gas/fire).
          +        case 5: r = (Theft4TouchRect){width-edge-2.5*b-gap, height-edge-1.25*b, 1.25*b, 1.25*b}; break;
          +        case 10: r = (Theft4TouchRect){width-edge-1.25*b, height-edge-1.25*b, 1.25*b, 1.25*b}; break;
          +        case 6: r.x = right; r.y = bottom-2.25*b-2*gap; break;
          +        case 7: r.x = right-step; r.y = bottom-2.25*b-2*gap; break;
          +        case 8: r.x = right; r.y = bottom-1.25*b-gap; break;
          +        case 9: r.x = right-step; r.y = bottom-1.25*b-gap; break;
          +        case 11: r = (Theft4TouchRect){edge+ds, edge, small, small}; break;
          +        case 12: r = (Theft4TouchRect){edge+ds, edge+2*ds, small, small}; break;
          +        case 13: r = (Theft4TouchRect){edge, edge+ds, small, small}; break;
          +        case 14: r = (Theft4TouchRect){edge+2*ds, edge+ds, small, small}; break;
          +        case 15: r.x = edge+d+gap; r.y = bottom; break;
          +        case 16: r.x = width-edge-3.5*b-2*gap; r.y = bottom; break;
          +    }
          +    return r;
          +}
          --- /dev/null
          +++ b/ios/tests/touch_policy_test.c
          @@ -0,0 +1,36 @@
          +#include "Theft4TouchPolicy.h"
          +#include <assert.h>
          +#include <stdio.h>
          +
          +static void check_layout(double w, double h) {
          +    for (int i=0; i<17; ++i) {
          +        Theft4TouchRect a = theft4_control_rect(i,w,h);
          +        assert(a.x >= 0 && a.y >= 0 && a.x+a.w <= w && a.y+a.h <= h);
          +        assert(a.w >= 36 && a.h >= 36);
          +        for (int j=0; j<i; ++j) {
          +            Theft4TouchRect b = theft4_control_rect(j,w,h);
          +            if (a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y) fprintf(stderr,"overlap %g x %g: %d / %d\n",w,h,i,j);
          +            assert(!(a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y));
          +        }
          +    }
          +}
          +int main(void) {
          +    assert(theft4_look_sensitivity(NAN) == 1);
          +    assert(theft4_look_sensitivity(INFINITY) == 1);
          +    assert(theft4_look_sensitivity(-1) == .25);
          +    assert(theft4_look_sensitivity(9) == 4);
          +    assert(theft4_swipe_axis(0,1.0/60,4) == 0);
          +    assert(theft4_swipe_axis(18,1.0/60,1) == 32767);
          +    assert(theft4_swipe_axis(-18,1.0/60,1) == -32767);
          +    assert(theft4_swipe_axis(10000,1.0/60,4) == 32767);
          +    assert(theft4_swipe_axis(9,1.0/60,1) == theft4_swipe_axis(18,1.0/30,1));
          +    assert(theft4_swipe_axis(9,1.0/60,1) == theft4_swipe_axis(4.5,1.0/120,1));
          +    assert(theft4_swipe_axis(9,1.0/60,1) == theft4_swipe_axis(4.5,1.0/60,2));
          +    assert(theft4_swipe_axis(20,.5,1) == 0); // Discard stale motion after a stall.
          +    assert(theft4_swipe_axis(NAN,1.0/60,1) == 0);
          +    assert(theft4_swipe_axis(5,0,1) == 0);
          +    check_layout(568,300); check_layout(667,354); check_layout(724,354);
          +    check_layout(818,381); check_layout(932,409); check_layout(1024,724);
          +    check_layout(1194,790); check_layout(1366,980);
          +    puts("Swipe scaling, clamping, stale-input and landscape layout tests passed.");
          +}
          THEFT4_TOUCH_PATCH_END
